<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cert Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow column that behaves like an exam screen. Status line, question card, diff-style feedback, question map. Progress view reuses the same rows and tokens. */
:root{
  --bg:#f1f5f8;--surface:#ffffff;--fg:#12202b;--muted:#566776;--line:#d2dbe3;
  --accent:#0a6a94;--accent-fg:#ffffff;--accent-soft:#e0eff6;
  --good:#17692f;--good-bg:#e3f4e7;--bad:#a42a20;--bad-bg:#fbe8e6;--warn:#8a5a00;--warn-bg:#fcf0d3;
  --font-display:"Schibsted Grotesk",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c;--surface:#151f28;--fg:#e5edf3;--muted:#8ea0af;--line:#2a3845;
  --accent:#4db3d9;--accent-fg:#06222d;--accent-soft:#12303d;
  --good:#5fd47a;--good-bg:#12301c;--bad:#ff8a80;--bad-bg:#3a1816;--warn:#e6b84a;--warn-bg:#3a2f10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c;--surface:#151f28;--fg:#e5edf3;--muted:#8ea0af;--line:#2a3845;
  --accent:#4db3d9;--accent-fg:#06222d;--accent-soft:#12303d;
  --good:#5fd47a;--good-bg:#12301c;--bad:#ff8a80;--bad-bg:#3a1816;--warn:#e6b84a;--warn-bg:#3a2f10;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body)}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 32px/1.08 var(--font-display);letter-spacing:-.02em;margin:6px 0 12px;text-wrap:balance}
h2{font:700 18px/1.25 var(--font-display);margin:0 0 10px;text-wrap:balance}
p{margin:0 0 12px}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:64ch;margin-bottom:24px}
.block{margin:0 0 28px}
.sp{flex:1}
.up{color:var(--good)}
.down{color:var(--bad)}

.topnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;color:inherit;font:inherit}
.mode b{display:block;font:600 15px var(--font-display);margin-bottom:3px}
.mode span{color:var(--muted);font-size:13.5px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}

.dtable{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.drow:first-child{border-top:0}
.drow input{accent-color:var(--accent)}
.drow .name{flex:1 1 220px;min-width:0}
.drow .meta{font:12.5px var(--font-mono);color:var(--muted)}
.drow.off{opacity:.55;cursor:default}

.btn{font:600 14px var(--font-body);padding:10px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.mode:focus-visible,.chip:focus-visible,.drop:focus-visible,select:focus-visible,.cell:focus-visible,.flag:focus-visible,.mv button:focus-visible,.opt:has(input:focus-visible),.drow:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tips{margin:0;padding-left:18px;color:var(--muted)}
.tips li{margin-bottom:5px}
.note{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px}

.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font:12.5px var(--font-mono);color:var(--muted)}
.status .tag{padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.progress{height:3px;background:var(--line);margin:10px 0 14px;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.qhead{display:flex;justify-content:space-between;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font:12px var(--font-mono);color:var(--muted)}
.flag{font:500 12px var(--font-mono);padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--muted);cursor:pointer}
.flag[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.stem{font:600 17px/1.45 var(--font-display);margin:0 0 6px;text-wrap:pretty}
.instr{color:var(--muted);font-size:13.5px;margin:0 0 14px}

.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer;position:relative;background:var(--surface)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font:500 12px var(--font-mono);color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.locked .opt,.locked .chip,.locked .drop,.locked .yn-r label{cursor:default}

.yn{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.yn-h,.yn-r{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;align-items:center;gap:6px;padding:9px 12px}
.yn-h{background:var(--bg);font:500 12px var(--font-mono);color:var(--muted);text-align:center}
.yn-h span:first-child{text-align:left}
.yn-r{border-top:1px solid var(--line)}
.yn-r label{display:grid;place-items:center;min-height:34px;cursor:pointer}
.yn-r input{accent-color:var(--accent);width:17px;height:17px}
.yn-r.right{background:var(--good-bg)}
.yn-r.wrong{background:var(--bad-bg)}

.dd{line-height:2.5;margin:0}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
select.right{border-color:var(--good);background:var(--good-bg)}
select.wrong{border-color:var(--bad);background:var(--bad-bg)}

.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:6px;margin-bottom:12px;min-height:48px;background:var(--bg)}
.pool em,.drop em{color:var(--muted);font-size:13px;padding:0 6px}
.chip{display:inline-block;font:500 13.5px/1.35 var(--font-body);text-align:left;padding:7px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:grab;user-select:none}
.chip.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot-l{font-size:14px}
.drop{min-height:44px;display:flex;align-items:center;padding:4px;border:1px dashed var(--line);border-radius:6px;cursor:pointer}
.slot.right .drop{border-color:var(--good);background:var(--good-bg)}
.slot.wrong .drop{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){.slot{grid-template-columns:1fr;gap:6px}}

.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord li{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.pos{flex:none;width:24px;height:24px;display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px}
.otext{flex:1;min-width:0}
.mv{display:flex;gap:4px}
.mv button{font:500 12px var(--font-mono);padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer}
.mv button:disabled{opacity:.35;cursor:default}
.ord li.right{border-color:var(--good);background:var(--good-bg)}
.ord li.wrong{border-color:var(--bad);background:var(--bad-bg)}

.fb{margin-top:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fb-h{font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px}
.fb.ok .fb-h{background:var(--good-bg);color:var(--good)}
.fb.no .fb-h{background:var(--bad-bg);color:var(--bad)}
.diff{font:13px/1.5 var(--font-mono);padding:4px 12px 4px 30px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.diff::before{position:absolute;left:12px}
.diff.add{background:var(--good-bg);color:var(--good)}
.diff.add::before{content:"+"}
.diff.del{background:var(--bad-bg);color:var(--bad)}
.diff.del::before{content:"-"}
.why{margin:0;padding:10px 12px;font-size:14px}

.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}
.confirm{border:1px solid var(--warn);background:var(--warn-bg);padding:12px 14px;border-radius:6px;margin:0 0 20px}
.confirm p{margin:0 0 10px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-bottom:8px}
.cell{height:36px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--muted);font:500 12px var(--font-mono);cursor:pointer;position:relative}
.cell.done{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.cell.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{font:12px var(--font-mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}

.score{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;margin:6px 0 22px}
.score .big{font:700 46px/1 var(--font-display);letter-spacing:-.02em}
.score .sm{font:13px var(--font-mono);color:var(--muted)}
.rrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 7ch;gap:6px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow small{display:block;color:var(--muted);font:12px var(--font-mono)}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.low i{background:var(--bad)}
.pct{font:500 13px var(--font-mono);text-align:right}
.pct.low{color:var(--bad)}
@media (max-width:520px){.rrow{grid-template-columns:minmax(0,1fr) 7ch}.rrow .bar{grid-column:1/-1;order:3}}
.miss{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;margin-bottom:12px}
.miss .stem{font-size:15.5px}

.chart{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chart .gl{stroke:var(--line);stroke-width:1;fill:none}
.chart .tgt{stroke:var(--good);stroke-width:1;stroke-dasharray:4 4;fill:none}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tx{fill:var(--muted);font:11px var(--font-mono)}
.chart .tg{fill:var(--good);font:11px var(--font-mono)}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .when{font:12.5px var(--font-mono);color:var(--muted);flex:1 1 150px}
.arow .sc{font:500 14px var(--font-mono)}
.arow .dl{font:12.5px var(--font-mono)}
.arow .qs{flex:1 1 240px;min-width:0;font-size:14px}
.arow .qm{font:12px var(--font-mono);color:var(--muted)}
.rev{margin:0;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13.5px}
.links a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.links .k{font:11px var(--font-mono);color:var(--muted);margin-left:5px;text-transform:uppercase;letter-spacing:.05em}
.trow{padding:12px 14px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.thead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 7ch;gap:6px 14px;align-items:center;margin-bottom:8px}
.thead small{display:block;color:var(--muted);font:12px var(--font-mono)}
@media (max-width:520px){.thead{grid-template-columns:minmax(0,1fr) 7ch}.thead .bar{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.plan{display:flex;align-items:center;gap:8px}
.plan span{font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plan select{font:600 14px var(--font-body);padding:9px 10px}
.topnav{align-items:center}
.code{font:12.5px/1.6 var(--font-mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:0 0 14px;white-space:pre;tab-size:2}
.code select{font:12.5px var(--font-mono);padding:2px 6px;line-height:1.4}
.reslist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reslist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.reslist a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.reslist .k{font:11px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.notice{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:14px}
.foot{color:var(--muted);font-size:13px;margin-top:8px}
.jsonbox{width:100%;min-height:120px;margin-top:10px;font:12px/1.5 var(--font-mono);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.btn[for]{display:inline-block}
.foot a{color:var(--accent);text-underline-offset:2px}

.cstats{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px;font-size:14px;color:var(--muted)}
.cstats b{font:600 22px var(--font-display);color:var(--fg);margin-right:4px}
.cprog{font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cardbox{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:20px 18px;min-height:150px}
.cfront{font:600 22px/1.35 var(--font-display);margin:12px 0 0}
.cback{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.cback p{margin:0 0 8px}

.labbox h2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:16px}
.labbox h2 a{color:var(--accent);text-underline-offset:2px}
.labbox h2 small{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.labtasks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.labtasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.labtasks input{margin-top:4px}
.labmore{font-size:13px;color:var(--muted);margin:10px 0 0}
.labmore a{color:var(--accent);text-underline-offset:2px}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const EXAMS={};
EXAMS.gh900=Object.assign((function(){

const DOMAINS=[
 {n:'Understand Git and GitHub basics',w:'25-30%'},
 {n:'Work with GitHub repositories',w:'10-15%'},
 {n:'Collaborate using GitHub',w:'10-15%'},
 {n:'Apply modern development practices',w:'10-15%'},
 {n:'Manage projects with GitHub',w:'5-10%'},
 {n:'Privacy, security, and administration',w:'10-15%'},
 {n:'Explore the GitHub community',w:'5-10%'}
];
const EXAM_MIX=[15,7,7,7,4,6,4];
const Q=[];let _n=0;
let _cur;const tp=t=>{_cur=t};
const add=o=>{o.id=++_n;o.topic=_cur;Q.push(o)};
const YNQ='For each of the following statements, select Yes if the statement is true. Otherwise, select No.';
const mc=(d,q,opts,a,why)=>add({d,t:'mc',q,opts,a,why});
const multi=(d,q,opts,a,why)=>add({d,t:'multi',q,opts,a,why,k:a.length});
const yn=(d,ctx,rows,why)=>add({d,t:'yn',q:ctx+' '+YNQ,rows,why});
const dd=(d,tpl,sels,why)=>add({d,t:'dd',q:'Complete the statement by selecting the correct option in each list.',tpl,sels,why});
const match=(d,q,items,slots,why)=>add({d,t:'match',q,items,slots,why});
const order=(d,q,steps,why)=>add({d,t:'order',q,steps,why});

/* ===== Original bank (ids 1-47, keep order so saved history stays valid) ===== */

/* Domain 1: Understand Git and GitHub basics */
mc(1,'What is the main difference between Git and GitHub?',
 ['Git is a distributed version control system, and GitHub is a platform that hosts Git repositories and adds collaboration features','Git is a cloud platform owned by Microsoft, and GitHub is the command-line tool used to work with it','Git and GitHub are two names for the same product','Git manages project boards and issues, and GitHub tracks file history'],0,
 'Git is the version control tool that runs on your machine. GitHub is a hosting platform built around Git that adds pull requests, issues, Actions and more.');
yn(1,'Statements about Git.',
 [['Git requires a network connection to create a commit.',false],['A cloned repository contains the full history of the project.',true],['Git repositories can only be hosted on GitHub.',false],['A commit records a snapshot of the tracked files at a point in time.',true]],
 'Commits are created locally, so no connection is needed. A clone copies the full history. Other services can host Git repositories, and each commit is a snapshot of the project.');
match(1,'Match each term to its definition. Some items are not used.',
 ["A project's files together with the full history of changes to them",'A saved snapshot of changes with a message and a unique ID','An independent line of development','A local copy of a remote repository, including its history','A request to merge changes after review'],
 [['Repository',0],['Commit',1],['Branch',2],['Clone',3]],
 'The unused item describes a pull request, which proposes merging one branch into another.');
order(1,'Arrange the steps of the GitHub flow in the correct order.',
 ['Create a branch','Make and commit changes on the branch','Open a pull request','Review the changes and address feedback','Merge the pull request','Delete the branch'],
 'GitHub flow is a lightweight, branch-based workflow: branch, change, pull request, review, merge, then clean up.');
mc(1,'Which Markdown syntax creates an unchecked task list item in an issue or pull request description?',
 ['- [ ] Write the tests','[ ] - Write the tests','* ( ) Write the tests','# [ ] Write the tests'],0,
 "A task list item is a list marker followed by square brackets: '- [ ]' for open and '- [x]' for done.");
match(1,'Match each scenario to the GitHub product that fits it best. Some items are not used.',
 ['GitHub Desktop','GitHub Mobile','GitHub CLI','GitHub Codespaces'],
 [['Review a pull request and triage notifications from a phone',1],['Commit, branch and push using a graphical app on Windows or macOS',0],['Create a pull request from the terminal with gh pr create',2]],
 'Codespaces is a cloud development environment, which none of these scenarios needed.');
mc(1,'Which Git command uploads your local commits to a remote repository?',
 ['git push','git pull','git fetch','git clone'],0,
 "'git push' sends local commits to the remote. 'git pull' and 'git fetch' bring changes down, and 'git clone' copies a repository.");
dd(1,'Running {0} downloads new commits from the remote without changing your working files. Running {1} downloads them and also merges them into your current branch.',
 [[['git fetch','git pull','git push','git clone'],0],[['git fetch','git pull','git push','git clone'],1]],
 "'git fetch' only updates your view of the remote. 'git pull' is a fetch followed by a merge.");
mc(1,'Two developers change the same lines of a file on different branches. What happens when the branches are merged?',
 ['Git reports a merge conflict that must be resolved manually','Git keeps the changes from the branch with the most commits','Git always keeps the changes from the branch being merged into','GitHub deletes the older branch'],0,
 'When changes overlap and Git cannot reconcile them, it marks a merge conflict and asks a person to choose the result.');
mc(1,'You want to notify a specific person in a pull request comment. What do you type?',
 ['@ followed by their username','# followed by their username','! followed by their username','$ followed by their username'],0,

/* Shared helper that builds a question bank. Each question names a topic, and the topic fixes its domain. */
function makeBank(TOPICS){
  const Q=[];let n=0;
  const YNQ='For each of the following statements, select Yes if the statement is true. Otherwise, select No.';
  const add=(topic,o)=>{
    if(!TOPICS[topic])throw new Error('Unknown topic '+topic);
    o.topic=topic;o.d=TOPICS[topic].d;o.id=++n;Q.push(o);
  };
  return {
    Q:Q,
    mc:(topic,q,opts,a,why,code)=>add(topic,{t:'mc',q:q,opts:opts,a:a,why:why,code:code}),
    multi:(topic,q,opts,a,why,code)=>add(topic,{t:'multi',q:q,opts:opts,a:a,why:why,code:code,k:a.length}),
    yn:(topic,ctx,rows,why,code)=>add(topic,{t:'yn',q:ctx+' '+YNQ,rows:rows,why:why,code:code}),
    dd:(topic,tpl,sels,why)=>add(topic,{t:'dd',q:'Complete the statement by selecting the correct option in each list.',tpl:tpl,sels:sels,why:why}),
    ddc:(topic,instr,codeTpl,sels,why)=>add(topic,{t:'dd',q:instr,tpl:'',codeTpl:codeTpl,sels:sels,why:why}),
    match:(topic,q,items,slots,why)=>add(topic,{t:'match',q:q,items:items,slots:slots,why:why}),
    order:(topic,q,steps,why)=>add(topic,{t:'order',q:q,steps:steps,why:why})
  };
}

['entra','Entra roles vs Azure roles','Microsoft Entra roles manage the directory (users, groups, apps). Azure RBAC roles manage Azure resources (VMs, storage, networks).'],
['entra','User Administrator','A Microsoft Entra role: create and manage users and reset passwords. It does not grant access to Azure resources.'],
['entra','Dynamic group','Membership is set by a rule on user or device attributes. Needs Entra ID P1 or higher.'],
['entra','Group-based licensing','Assign licences to a group and members inherit them. Users need a usage location first.'],
['entra','External (guest) users','Invited with B2B collaboration. They sign in with their own identity provider.'],

['rbac','Owner, Contributor, Reader, User Access Administrator','Owner: everything including assigning roles. Contributor: manage resources, no role assignment. Reader: view only. User Access Administrator: manage access only.'],
['rbac','Role assignment','Security principal + role definition + scope.'],
['rbac','Scope order','Management group, subscription, resource group, resource. Assignments inherit downwards.'],
['rbac','Combining role assignments','Permissions are additive. Reader at subscription plus Contributor on a resource group means Contributor on that group.'],
['rbac','Custom role','JSON definition with Actions, NotActions and AssignableScopes.'],
['rbac','Check access','The IAM blade tool that shows what access a user, group or service principal has at that scope.'],
['governance','Azure Policy vs RBAC','Policy controls what resources can look like (location, SKU, tags). RBAC controls who can do what.'],
['governance','Policy effects','Deny blocks. Audit records non-compliance. Modify changes properties such as tags. DeployIfNotExists deploys a related resource. Disabled turns it off.'],
['governance','Policy initiative','A group of policy definitions assigned together.'],
['governance','Resource locks','CanNotDelete: read and modify allowed. ReadOnly: read only. Locks apply to everyone, including owners, and are inherited.'],

['governance','Management groups','Containers above subscriptions. Apply policy and RBAC once to many subscriptions.'],
['governance','Resource groups','A resource belongs to one group. Deleting the group deletes its resources. Resources in a group can be in different regions.'],

['cost','Cost analysis','Break down spend by service, resource group, tag or location.'],
['storageacct','Redundancy options','LRS: 3 copies in one datacenter. ZRS: across zones. GRS: LRS plus a secondary region. GZRS: ZRS plus a secondary region. RA adds read access to the secondary.'],

['storageacct','Storage encryption','Always on at rest with Microsoft-managed keys. Customer-managed keys in Key Vault are optional.'],

['storagesec','Stored access policy','Lets you change or revoke service SAS tokens that use it without regenerating keys.'],
['storagesec','Access keys','Two keys per account for rotation. Regenerating a key invalidates SAS tokens signed with it.'],
['storagesec','Identity-based access for Azure Files','Active Directory Domain Services, Microsoft Entra Domain Services, or Entra Kerberos for hybrid identities, over SMB.'],
['blobfiles','Blob access tiers','Hot: frequent. Cool: 30+ days. Cold: 90+ days. Archive: 180+ days and offline, needs rehydration.'],
['blobfiles','Blob protection features','Soft delete recovers deleted data. Versioning keeps prior versions automatically. Snapshots are manual point-in-time copies.'],
['blobfiles','Lifecycle management','Rules that move blobs between tiers or delete them based on age.'],
['blobfiles','Blob types','Block: general files. Append: logs. Page: disks and random access.'],
['arm','Template sections','parameters (inputs), variables, resources, outputs.'],
['arm','Deployment modes','Incremental (default) adds and updates. Complete deletes resources in the group that are not in the template.'],
['arm','What-if','Previews what a deployment would create, change or delete.'],
['arm','Bicep tips','az bicep decompile converts ARM JSON to Bicep. The existing keyword references a deployed resource. targetScope = subscription is needed to create resource groups.'],
['arm','Deployment scopes','Resource group, subscription, management group and tenant. Use az deployment group, sub, mg or tenant create.'],

['vms','Availability set vs zones','Availability set: fault and update domains in one datacenter. Zones: separate datacenters within a region. Neither protects against a whole-region outage.'],
['vms','Disk types','Standard HDD, Standard SSD, Premium SSD, Ultra Disk (highest performance). The temporary disk is not persistent.'],
['vms','Encryption at host','Encrypts temp disks and caches on the VM host. The feature must be enabled on the subscription.'],
['vms','Moving a VM','Between resource groups or subscriptions: Move. Between regions: Azure Resource Mover or replication.'],
['vms','VM scale sets','Autoscale by metric or schedule with min, max and default counts. A cooldown avoids flapping.'],
['containers','ACR SKUs','Basic, Standard, Premium. Geo-replication needs Premium.'],
['containers','ACI vs Container Apps','ACI: simplest single containers, billed per second, no orchestration. Container Apps: serverless microservices, scale to zero on HTTP or events.'],

['appservice','Scale up vs scale out','Up: bigger plan. Out: more instances.'],

['appservice','Deployment slots','Deploy, test, swap. Slot settings stay with the slot. Swap back to roll back.'],
['appservice','VNet integration vs private endpoint','Integration: outbound from the app to a VNet. Private endpoint: private inbound access to the app.'],
['appservice','Custom domain records','Subdomain: CNAME. Root (apex): A record. Azure verifies ownership with a TXT record.'],
['vnet','Reserved addresses','Azure reserves 5 addresses per subnet, so a /24 has 251 usable.'],
['vnet','Peering','Needs non-overlapping address spaces, works across regions and subscriptions, and is not transitive.'],
['vnet','User-defined routes','Route table on a subnet. Common use: 0.0.0.0/0 with next hop Virtual appliance. Longest prefix wins.'],

/* Shared helper that builds a question bank. Each question names a topic, and the topic fixes its domain. */
function makeBank(TOPICS){
  const Q=[];let n=0;
  const YNQ='For each of the following statements, select Yes if the statement is true. Otherwise, select No.';
  const add=(topic,o)=>{
    if(!TOPICS[topic])throw new Error('Unknown topic '+topic);
    o.topic=topic;o.d=TOPICS[topic].d;o.id=++n;Q.push(o);
  };
  return {
    Q:Q,
    mc:(topic,q,opts,a,why,code)=>add(topic,{t:'mc',q:q,opts:opts,a:a,why:why,code:code}),
    multi:(topic,q,opts,a,why,code)=>add(topic,{t:'multi',q:q,opts:opts,a:a,why:why,code:code,k:a.length}),
    yn:(topic,ctx,rows,why,code)=>add(topic,{t:'yn',q:ctx+' '+YNQ,rows:rows,why:why,code:code}),
    dd:(topic,tpl,sels,why)=>add(topic,{t:'dd',q:'Complete the statement by selecting the correct option in each list.',tpl:tpl,sels:sels,why:why}),
    ddc:(topic,instr,codeTpl,sels,why)=>add(topic,{t:'dd',q:instr,tpl:'',codeTpl:codeTpl,sels:sels,why:why}),
    match:(topic,q,items,slots,why)=>add(topic,{t:'match',q:q,items:items,slots:slots,why:why}),
    order:(topic,q,steps,why)=>add(topic,{t:'order',q:q,steps:steps,why:why})
  };
}

/* ===== Domain 1: processes and communications ===== */

mc('flow','A team wants every commit and pull request on GitHub to be linked to a work item in Azure Boards so they can trace code changes back to requirements. What should they do?',
 ['Connect the repository to the Azure Boards project with the Azure Boards app, then mention work items with AB# in commits and pull requests','Create a webhook that copies each commit message into a new work item','Add a branch protection rule that requires a work item ID in every branch name','Export the commits to a CSV file and import them into Azure Boards each week'],0,
 'The Azure Boards app connects a GitHub repository to a project. A mention such as AB#123 in a commit, pull request or issue then creates a link to work item 123.');
yn('flow','Statements about traceability and flow of work.',
 [['A commit that mentions a work item can create a development link from the work item to the commit.',true],['GitHub flow keeps a long-lived develop branch alongside main.',false],['A pull request that uses a closing keyword such as Fixes #12 can close the issue when it is merged into the default branch.',true],['Azure Boards can only track work for repositories that are hosted in Azure Repos.',false]],
 'Mentions create links, and GitHub flow uses main plus short-lived branches. Closing keywords close the issue on merge. Azure Boards can connect to GitHub repositories as well.');
mc('flow','Which description matches GitHub flow?',
 ['Branch from main, commit changes, open a pull request, review, merge to main and deploy','Maintain separate develop, release and hotfix branches with scheduled merges','Commit directly to main with no review and no branches','Fork the repository for every change and send patches by email'],0,
 'GitHub flow is lightweight: main is always deployable and all changes arrive through short-lived branches and pull requests.');
match('flow','Match each Azure Boards process to the situation it fits best. Some items are not used.',
 ['Basic','Agile','Scrum','CMMI'],
 [['Teams that plan work as product backlog items in sprints',2],['Teams that want the simplest set of work item types, such as issues and tasks',0],['Organisations that formally track requirements, change requests and risks',3]],
 'Scrum uses product backlog items, Basic uses issues and tasks, and CMMI adds formal requirements, change requests and risks. Agile (user stories) was not needed.');

mc('metrics','Which metric measures the time from when work is first requested until it is delivered?',
 ['Lead time','Cycle time','Change failure rate','Deployment frequency'],0,
 'Lead time covers the whole wait from request to delivery. Cycle time starts when work actually begins.');
match('metrics','Match each DORA metric to what it measures. All items are used once.',
 ['Deployment frequency','Lead time for changes','Change failure rate','Time to restore service'],
 [['How often the team releases to production',0],['How long it takes a change to reach production after it is committed',1],['The percentage of deployments that cause a failure in production',2],['How quickly service is recovered after an incident',3]],
 'These are the four classic DORA delivery and stability measures.');
mc('metrics','Which Azure Boards chart shows how many work items are in each state over time, so you can spot a bottleneck where work is piling up?',
 ['Cumulative flow diagram','Burndown chart','Velocity chart','Sprint capacity chart'],0,
 'A cumulative flow diagram stacks work items by state. A widening band shows work accumulating in that state.');
mc('metrics','A team lead wants a dashboard widget that shows how long work items take to move from active to closed. Which widget fits best?',
 ['Cycle Time','Query tile','Markdown','Work links'],0,
 'The Cycle Time analytics widget reports how long items take to complete. Query tiles just count results.');
dd('metrics','A {0} query returns work items as a simple list, and a {1} query shows work items with their parent and child hierarchy.',
 [[['flat list','tree of work items','direct links'],0],[['flat list','tree of work items','direct links'],1]],
 'Azure Boards queries come as flat lists, trees of work items and direct links.');

mc('docs','A team wants to draw a flowchart inside an Azure DevOps wiki page or a GitHub README without storing an image file. What should they use?',
 ['A Mermaid diagram written as text in the page','An HTML iframe pointing at another site','A Visio file attached to the page','A PowerShell script that runs on page load'],0,
 'Mermaid draws diagrams from text. GitHub renders a mermaid code fence, and Azure DevOps wikis use a ::: mermaid block.');
mc('docs','Which Azure DevOps wiki option publishes Markdown files that already live in a Git repository as a wiki?',
 ['Publish code as wiki','Provisioned wiki','A dashboard Markdown widget','A pipeline artifact'],0,
 'Publish code as wiki points a wiki at a folder in a repository. The provisioned wiki is the built-in wiki created for the project.');
mc('docs','How can a GitHub repository generate categorised release notes automatically when a release is published?',
 ['Use generated release notes and define the categories in .github/release.yml','Enable the Wikis feature','Create a Discussion for each release','Add a CODEOWNERS entry for the release manager'],0,
 'GitHub can generate release notes from merged pull requests, and .github/release.yml groups them by label into categories.');

mc('integrations','A team wants a Microsoft Teams channel to show a message when an Azure Pipelines run fails. What is the simplest approach?',
 ['Add the Azure Pipelines app to the channel and subscribe to pipeline events','Write an Azure Function that polls the pipelines API every minute','Email the build log to every team member','Create a Teams meeting for each failed build'],0,
 'The Azure Pipelines app for Teams can subscribe a channel to pipeline events with no custom code.');
mc('integrations','An external ticketing system must be notified whenever a pull request is merged in a GitHub repository. What should be configured?',
 ['A repository webhook for pull request events','A branch protection rule','A CODEOWNERS file','A GitHub Pages site'],0,
 'A webhook sends an HTTP POST with the event payload to a URL you choose when the selected events occur.');
yn('integrations','Statements about webhooks and service hooks.',
 [['A webhook delivers an HTTP POST request to a URL you configure when a selected event happens.',true],['Azure DevOps service hooks can send events to services such as webhooks, Slack and Microsoft Teams.',true],['A webhook secret lets the receiver verify that a payload came from the expected sender.',true],['A webhook can only be created by using the GitHub CLI.',false]],
 'Webhooks and service hooks push event data to other services. Secrets let the receiver validate the sender, and webhooks can be created in the web interface or API.');

/* ===== Domain 2: source control strategy ===== */

mc('branching','A team deploys to production several times a day from a single main branch, hides unfinished work behind feature flags and merges short-lived branches within a day. Which strategy is this?',
 ['Trunk-based development','Release branching','Git flow','A fork for every developer'],0,
 'Trunk-based development keeps everyone integrating into one main branch in small, frequent changes.');
mc('branching','A product supports several customer-facing versions at once, and security fixes must be applied to older versions. Which branching approach fits best?',
 ['Release branches for each supported version','Trunk-based development with no release branches','One long-lived feature branch','Developers commit directly to production'],0,
 'Release branches let the team stabilise and patch a specific version while main moves on.');
match('branching','Match each branching strategy to its description. All items are used once.',
 ['Trunk-based','Feature branch','Release branch'],
 [['Developers integrate small changes into main very often, usually behind feature flags',0],['Each change is developed in isolation and merged by pull request when complete',1],['A branch is cut to stabilise and maintain a specific version while main moves on',2]],
 'Each strategy trades isolation against integration frequency.');
dd('branching','In Git flow, the {0} branch holds released code, and the {1} branch is where completed features are integrated.',
 [[['develop','main','release','hotfix'],1],[['develop','main','release','hotfix'],0]],
 'Git flow has two long-lived branches: main for released code and develop for integration. GitHub flow has only main.');

mc('branchpol','In Azure Repos, which branch policy makes sure the code builds and tests pass before a pull request can complete?',
 ['Build validation','Minimum number of reviewers','Check for linked work items','Limit merge types'],0,
 'Build validation queues a pipeline run for the pull request and can block completion if it fails.');
multi('branchpol','Which TWO branch policies can you configure in Azure Repos to improve the quality of pull requests?',
 ['Require a minimum number of reviewers','Require comment resolution','Allow force pushes for every contributor','Turn off work item linking'],[0,1],
 'Reviewer counts and comment resolution are branch policies. Force pushing is a permission, and allowing it for everyone weakens protection.');
mc('branchpol','A GitHub repository must have a linear history on main with no merge commits. Which branch protection setting enforces this?',
 ['Require linear history','Require signed commits','Require deployments to succeed','Lock branch'],0,
 'Require linear history blocks merge commits, so pull requests can only be squashed or rebased.');
yn('branchpol','Statements about pull requests and branch protection.',
 [['In Azure Repos Git, a pull request build is triggered by a build validation branch policy rather than the pr keyword in YAML.',true],['A GitHub branch protection rule can require status checks to pass before merging.',true],['Administrators can never bypass branch protection under any configuration.',false],['Squash merge keeps every individual commit of the source branch in the target history.',false]],
 'The pr keyword is for GitHub and Bitbucket. Administrators can bypass unless rules are enforced for them, and squash merge combines commits into one.');
mc('branchpol','Which merge type in Azure Repos combines all commits of a pull request into a single commit on the target branch?',
 ['Squash merge','Basic merge (no fast-forward)','Rebase and fast-forward','Rebase with merge commit'],0,
 'Squash merge produces one commit on the target branch. The other types keep the individual commits in some form.');

mc('repomgmt','A repository contains large binary design files that make clones slow. Which feature stores the files outside normal Git history and keeps small pointer files in the repository?',
 ['Git Large File Storage (LFS)','Git submodules','git stash','Shallow tags'],0,
 'Git LFS replaces large files with text pointers and stores the real content on a separate server.');
mc('repomgmt','A secret was committed several commits ago and has already been pushed. After rotating the secret, which action removes it from the repository history?',
 ['Rewrite history with git filter-repo or BFG Repo-Cleaner, then force push','Run git revert on the commit','Delete the file in a new commit','Add the file to .gitignore'],0,
 'Revert, deleting the file and .gitignore leave the secret in earlier commits. Rewriting history removes it, and rotating the secret first is still essential.');
mc('repomgmt','You reset a branch by mistake and lost three local commits. Which command helps you find their commit IDs?',
 ['git reflog','git blame','git remote -v','git tag --list'],0,
 'The reflog records where HEAD and branches have pointed, so lost commits can usually be found and restored for a while.');
mc('repomgmt','A very large monorepo is slow to clone and work in. Which Microsoft tool uses partial clone, sparse checkout and background maintenance to help?',
 ['Scalar','git-fat','Git hooks','Azure Artifacts'],0,
 'Scalar configures Git features that make very large repositories faster, and it ships with Git.');
match('repomgmt','Match each Git command to its purpose when fixing mistakes. All items are used once.',
 ['git revert','git reset','git cherry-pick','git reflog'],
 [['Create a new commit that undoes an earlier commit without rewriting history',0],['Move the current branch pointer to another commit',1],['Apply the changes from one commit onto the current branch',2],['Show where HEAD has previously pointed',3]],
 'Revert is safe on shared branches because it adds a commit instead of rewriting history.');
mc('repomgmt','Which command creates an annotated tag with a message for release 1.2.0?',
 ['git tag -a v1.2.0 -m "Release 1.2.0"','git branch v1.2.0','git commit --tag v1.2.0','git stash v1.2.0'],0,
 'Annotated tags store the tagger, date and a message, which makes them suitable for releases.');

/* ===== Domain 3: build and release pipelines ===== */

mc('packages','A team wants to share internal NuGet and npm packages and also consume public packages through a controlled source. Which Azure DevOps feature provides this?',

 ['2.4.2','2.5.0','3.0.0','2.4.1.1'],0,

mc('packages','Which version string uses calendar versioning (CalVer)?',

mc('packages','In Azure Artifacts, how can a team promote a package version from testing to production use without republishing it?',

mc('packages','A GitHub Actions workflow publishes a container image to GitHub Packages. Which credential is the most appropriate and least privileged?',

mc('packages','What does the publish step in this pipeline do?',

 'The publish shortcut uploads a pipeline artifact. It is not a package feed, and it does not deploy anything by itself.',
 'steps:\n- script: dotnet publish -o $(Build.ArtifactStagingDirectory)\n- publish: $(Build.ArtifactStagingDirectory)\n  artifact: drop');

mc('testing','Which type of test is the best candidate to run on every commit because it is fast and isolated?',
 ['Unit tests','Load tests','Manual exploratory tests','Penetration tests'],0,
 'Unit tests are quick and need no external environment, so they give the fastest feedback in CI.');
mc('testing','Which task publishes unit test results so they appear on the Tests tab of a pipeline run?',
 ['PublishTestResults','PublishPipelineArtifact','CopyFiles','ManualValidation'],0,
 'The Publish Test Results task reads result files such as JUnit or VSTest output and shows them in the run.');
mc('testing','A team wants to simulate thousands of concurrent users before release and fail the pipeline if response time targets are missed. Which Azure service integrates with CI/CD for this?',
 ['Azure Load Testing','Azure Advisor','Azure Policy','Azure Service Health'],0,
 'Azure Load Testing runs scalable load tests, such as JMeter scripts, with pass or fail criteria that can gate a pipeline.');
mc('testing','Which check on an Azure Pipelines environment can block a deployment while Azure Monitor alerts are active?',
 ['Query Azure Monitor alerts','Business hours','Branch control','Exclusive lock'],0,
 'The Query Azure Monitor alerts check evaluates the alerts on your resources and fails the check if any are active.');
multi('testing','Which TWO steps are needed to show code coverage results on a pipeline run?',
 ['Run the tests with code coverage collection enabled','Publish the coverage results with the PublishCodeCoverageResults task','Add a CODEOWNERS file','Create a feed view'],[0,1],
 'Coverage must be collected during the test run and then published so the run can display it.');
yn('testing','Statements about approvals and gates.',
 [['A pre-deployment approval pauses a stage until a person approves it.',true],['Gates evaluate automated conditions such as a REST API result or an Azure Monitor alert query.',true],['Approvals and gates can be used together on the same stage.',true],['Gates can only be used before the first stage of a pipeline.',false]],
 'Approvals involve people, gates are automated, and both can apply before or after deployment on any stage.');
order('testing','Arrange the test types from the largest number of tests to the smallest, as in the test pyramid.',
 ['Unit tests','Integration tests','End-to-end UI tests'],
 'The pyramid has many fast unit tests at the base and few slow UI tests at the top.');

mc('pipelines','A commit that only changes files under docs/ is pushed to main. What happens?',
 ['The pipeline does not run','The pipeline runs but skips every job','The pipeline runs and deploys to production','The pipeline waits for manual approval'],0,
 'The path filter excludes docs/*, so a push that only touches that folder does not trigger the pipeline.',
 'trigger:\n  branches:\n    include:\n      - main\n  paths:\n    exclude:\n      - docs/*');
mc('pipelines','For a repository in Azure Repos Git, how do you make a pipeline run when a pull request targets main?',
 ['Add a build validation branch policy on main','Add a pr: section to the YAML file','Add a schedules: section','Enable the project wiki'],0,
 'The pr keyword is supported for GitHub and Bitbucket Cloud. Azure Repos Git uses build validation branch policies.');
mc('pipelines','When does this schedule run?',
 ['At 02:00 UTC on weekdays, only if there are changes since the last successful scheduled run','At 02:00 UTC every day whether or not the code changed','At 02:00 local time on weekends','Every two hours on weekdays'],0,
 'Cron expressions use UTC, and always: false skips the run when nothing has changed since the last scheduled run succeeded.',
 'schedules:\n- cron: "0 2 * * 1-5"\n  displayName: Nightly build\n  branches:\n    include:\n    - main\n  always: false');
ddc('pipelines','Complete the YAML so that the Deploy stage starts only after the Build stage succeeds and only for the main branch.',
 'stages:\n- stage: Build\n  jobs:\n  - job: BuildJob\n    steps:\n    - script: echo build\n- stage: Deploy\n  {0}: Build\n  condition: and(succeeded(), eq(variables[\'Build.SourceBranch\'], \'{1}\'))\n  jobs:\n  - job: DeployJob\n    steps:\n    - script: echo deploy',
 [[['needs','dependsOn','requires','after'],1],[['main','refs/tags/main','refs/heads/main','heads/main'],2]],

 ['In parallel, unless dependsOn is set, subject to available parallel jobs','Sequentially, in the order written','Only one job per stage is allowed','Only on self-hosted agents'],0,
 'Stages run in order by default, but jobs in a stage have no dependencies unless you add them and can run at the same time.');
dd('pipelines','In a multi-stage pipeline, {0} run one after another by default, while {1} in the same stage can run at the same time if enough parallel jobs are available.',
 [[['stages','jobs','steps','tasks'],0],[['stages','jobs','steps','tasks'],1]],
 'Stages are sequential by default. Jobs within a stage are parallel unless dependencies say otherwise. Steps always run in order on one agent.');
mc('pipelines','What does this job configuration do?',
 ['Runs the job twice in parallel, once on a Linux image and once on a Windows image','Runs the job once on whichever image is free first','Runs on Linux, then on Windows only if the first run fails','Creates two stages named linux and windows'],0,
 'A matrix strategy creates one job per entry. Each job gets its own value of imageName.',
 'strategy:\n  matrix:\n    linux:\n      imageName: ubuntu-latest\n    windows:\n      imageName: windows-latest\npool:\n  vmImage: $(imageName)');
mc('pipelines','One pipeline must run automatically after another pipeline completes successfully. Which YAML feature defines this?',
 ['A pipeline resource with a trigger','A schedules block','A pr trigger','A variable group'],0,
 'Declaring the other pipeline under resources with a trigger starts this one when the upstream run completes.');

 ['$(var)','${{ var }}','$[ var ]'],
 [['Macro syntax, replaced with the value just before a task runs',0],['Template expression, evaluated when the YAML is compiled',1],['Runtime expression, evaluated while the pipeline runs and used in conditions or variable assignments',2]],
 'The three syntaxes are processed at different times, which decides where each one can be used.');
mc('pipelines','Which option pauses a YAML pipeline for manual approval without using an environment check?',
 ['The ManualValidation task in an agentless (server) job','The Delay task in an agent job','The PublishPipelineArtifact task','The CopyFiles task'],0,
 'ManualValidation runs in an agentless job, waits for a reviewer to resume or reject, and can time out.');
yn('pipelines','Statements about YAML pipelines.',
 [['A pipeline can contain several stages, and each stage can contain several jobs.',true],['The steps in a job run in order on the same agent.',true],['succeeded() is the default condition for a step.',true],['A variable marked as secret is automatically available to scripts as an environment variable.',false]],
 'Secret variables are not mapped into the environment for scripts automatically. You must pass them explicitly, for example with env.');

mc('agents','A build needs software licensed to a specific network and must reach a database inside a private virtual network. Which agent option is most suitable?',
 ['Self-hosted agents inside that network','Microsoft-hosted agents','GitHub Pages','Agents in a different organization'],0,
 'Self-hosted agents run in your own environment, so they can use licensed software and private network resources.');
mc('agents','A team wants build agents on Azure that scale out automatically and scale in when idle. Which option fits?',
 ['An Azure virtual machine scale set agent pool','A single always-on virtual machine','The developers\' laptops','Microsoft-hosted agents with manual scaling'],0,
 'Scale set agent pools let Azure Pipelines create and delete VMs to match demand. Managed DevOps Pools is a newer managed alternative.');
mc('agents','Which agent will run this job?',
 ['A self-hosted agent in the BuildPool pool that has the docker capability','A Microsoft-hosted agent with Docker preinstalled','Any agent in the organization','The first agent in the Default pool'],0,
 'name selects a self-hosted pool, and demands filters agents to those that advertise the required capability.',
 'pool:\n  name: BuildPool\n  demands:\n    - docker');
mc('agents','A GitHub organization must control which repositories can use a set of self-hosted runners. What should it configure?',
 ['Runner groups','Branch protection rules','Dependabot alerts','Deployment environments'],0,
 'Runner groups restrict which repositories and workflows can use a set of runners.');
mc('agents','A security team wants each job to run on a fresh runner that is removed afterwards so no state leaks between jobs. Which self-hosted runner approach fits?',
 ['Ephemeral runners that take one job and are then removed','One long-lived runner shared by every repository','Running jobs directly on developers\' machines','A persistent runner with cleanup scripts only'],0,
 'Ephemeral runners register for a single job, which prevents one job from affecting the next.');

mc('actions','Which statement about this workflow trigger is true?',
 ['The workflow can also be started manually from the Actions tab','The workflow only runs for the main branch','The workflow runs on a schedule at midnight','The workflow runs only for forks'],0,
 'workflow_dispatch adds a manual trigger. The pull_request event has no branch filter here, so it applies to all pull requests.',
 'on:\n  push:\n    branches: [ main ]\n  pull_request:\n  workflow_dispatch:');
mc('actions','A job must sign in to Azure from GitHub Actions without a stored long-lived secret. What is required?',
 ['permissions: id-token: write, and an Entra app with a federated credential used through azure/login','A service principal password in a repository secret rotated every year','A personal access token','A certificate committed to the repository'],0,
 'OpenID Connect lets the job request a short-lived token that Entra ID trusts through a federated credential.');
ddc('actions','Complete the workflow so that the job can request an OIDC token and uses the protection rules of the production deployment environment.',
 'permissions:\n  {0}: write\n  contents: read\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    {1}: production\n    steps:\n      - uses: azure/login@v2',
 [[['id-token','tokens','oidc','actions'],0],[['stage','target','environment','gate'],2]],
 'id-token: write allows the job to request an OIDC token. The environment key applies required reviewers and environment secrets.');
mc('actions','A job must run only after the build and test jobs succeed. Which keyword defines this?',
 ['needs: [build, test]','depends: [build, test]','after: [build, test]','requires: [build, test]'],0,
 'In GitHub Actions, needs lists the jobs that must finish first. Azure Pipelines uses dependsOn.');
mc('actions','How can a team reuse the same set of jobs from the workflows of several repositories?',
 ['Create a reusable workflow that uses the workflow_call trigger','Copy the YAML into each repository by hand','Use a CODEOWNERS file','Publish a GitHub Pages site'],0,
 'A reusable workflow is called from another workflow, which keeps logic in one place.');
multi('actions','Which TWO approaches run a job on more than one operating system in GitHub Actions?',
 ['Use strategy.matrix with an os list and runs-on: ${{ matrix.os }}','Define separate jobs with different runs-on values','Set runs-on to a list of operating systems with no matrix','Add a CODEOWNERS entry for each operating system'],[0,1],
 'A matrix or separate jobs each target one runner type. A list in runs-on selects a single runner that has all those labels.');
mc('actions','A workflow should cancel an older run when a newer commit is pushed to the same branch, so only the latest run executes. Which setting helps?',
 ['concurrency with cancel-in-progress: true','timeout-minutes','continue-on-error','needs'],0,
 'A concurrency group allows only one run at a time, and cancel-in-progress cancels the older one.');
yn('actions','Statements about GitHub Actions security.',
 [['The GITHUB_TOKEN is created for each workflow run and expires when the job finishes.',true],['Repository secrets are passed to workflows triggered by pull requests from forks by default.',false],['Workflow permissions can be limited to the minimum needed by using the permissions key.',true],['Environment secrets can be protected by requiring reviewers before the job is allowed to use them.',true]],
 'Secrets are withheld from fork pull requests by default, and environment protection rules gate access to environment secrets.');

mc('reuse','What is a benefit of using extends with a template like this one?',
 ['The pipeline author cannot skip or change the steps the template enforces, which supports central governance','It merges the pipeline into the main branch','It creates a variable group automatically','It runs the pipeline on every branch'],0,
 'With extends, the template controls the structure. Combined with a required template check, it enforces standard steps.',
 'extends:\n  template: templates/secure-build.yml\n  parameters:\n    buildConfiguration: Release');
mc('reuse','Several pipelines need the same non-secret values and a secret held in Azure Key Vault. Where should these be defined so they can be shared?',
 ['In a variable group, optionally linked to Azure Key Vault','Separately in each pipeline YAML file','In the repository README','In a pipeline artifact'],0,
 'Variable groups in the Library are shared across pipelines, and they can pull secrets from Key Vault at run time.');
mc('reuse','Which feature lets a team require approvals, branch control and business hours checks before a pipeline deploys to production?',
 ['Environment checks and approvals','Variable groups','Pipeline caching','Task groups'],0,
 'Checks and approvals are configured on the environment resource, so every pipeline that deploys there must pass them.');
match('reuse','Match each environment check to what it does. Some items are not used.',
 ['Approvals','Branch control','Business hours','Exclusive lock'],
 [['Pauses deployment until a named person or group approves',0],['Allows deployment only from specified branches',1],['Allows deployment only during a defined time window',2]],
 'Exclusive lock allows one run at a time, which was not described.');
dd('reuse','Use {0} to reuse a set of steps, jobs or stages in YAML pipelines, and {1} to reuse a sequence of tasks in classic pipelines.',
 [[['task groups','templates','variable groups','service connections'],1],[['task groups','templates','variable groups','service connections'],0]],
 'YAML templates replace task groups, which belong to classic pipelines.');
mc('reuse','A template needs a value from the calling pipeline, such as the build configuration. What should the template declare?',
 ['A parameter','A secure file','A service connection','A deployment job'],0,
 'Parameters pass typed values from the caller into a template.');
mc('reuse','A later job on a different agent needs a value calculated in an earlier job. How can it get the value?',
 ['Set the variable in a step with isOutput=true, then reference it through dependencies in the later job','Read it from the earlier agent\'s environment variables, which jobs share','Write it to the README','Use a task group'],0,

const CKEY=e=>'lab-cards-'+e;
const memCards={};
function readCS(e){
  try{const o=JSON.parse(localStorage.getItem(CKEY(e))||'null');if(o&&typeof o==='object')return o}catch(x){}
  return memCards[e]||{};
}
function writeCS(e,o){memCards[e]=o;try{localStorage.setItem(CKEY(e),JSON.stringify(o))}catch(x){}}
function cleanCS(o){
  const out={};
  if(!o||typeof o!=='object')return out;
  Object.keys(o).forEach(k=>{
    const v=o[k];
    if(/^[a-z0-9]+-\d{1,4}$/.test(k)&&v&&typeof v.b==='number'&&typeof v.s==='number')out[k]={b:Math.max(0,Math.min(3,Math.round(v.b))),s:Math.max(0,Math.round(v.s))};
  });
  return out;
}
const cardsOf=()=>X.cards||[];
const labsOf=()=>X.labs||[];
const LKEY=e=>'lab-labs-'+e;
const memLabs={};
function readLS(e){
  try{const o=JSON.parse(localStorage.getItem(LKEY(e))||'null');if(o&&typeof o==='object')return o}catch(x){}
  return memLabs[e]||{};
}
function writeLS(e,o){memLabs[e]=o;try{localStorage.setItem(LKEY(e),JSON.stringify(o))}catch(x){}}
function cleanLS(o){
  const out={};
  if(!o||typeof o!=='object')return out;
  Object.keys(o).forEach(k=>{if(/^[a-z0-9]+-L\d{1,3}-\d{1,3}$/.test(k)&&o[k])out[k]=1});
  return out;
}
const BOX_DONE=3;
function idleRender(){if(S.screen!=='quiz')render()}
function loadLocal(){
  let a=[];
  try{a=JSON.parse(localStorage.getItem(LSKEY)||'[]')}catch(e){a=[]}
  if(!Array.isArray(a)||!a.length){
    try{const o=JSON.parse(localStorage.getItem('gh900-attempts')||'[]');a=Array.isArray(o)?o:[]}catch(e){a=[]}
  }
  return a;
}
function fallbackLocal(){
  if(unsub){try{unsub()}catch(e){}unsub=null}
  DB=null;storeKind='local';attempts=loadLocal();ready=true;idleRender();
}
async function initStore(){
  let db=null,uid=null;
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      db=await window.claude.use('db');
      const u=await window.claude.use('user');
      uid=u&&typeof u.id==='function'?await u.id():null;
    }
  }catch(e){db=null;uid=null}
  if(!db||!uid){fallbackLocal();return}
  storeKind='cloud';
  try{
    DB=db.doc('data/users/'+uid+'/progress').collection('attempts');
    unsub=DB.orderBy('when','asc').limit(500).onSnapshot(
      snap=>{attempts=snap.docs.map(d=>Object.assign({id:d.id},d.data()));ready=true;idleRender()},
      ()=>{fallbackLocal()}
    );
  }catch(e){fallbackLocal()}
}
async function saveAttempt(rec){
  if(DB){
    try{await DB.doc(rec.id).set(rec);return 'cloud'}catch(e){return 'fail'}
  }
  try{
    attempts.push(rec);attempts.sort((a,b)=>a.when-b.when);
    localStorage.setItem(LSKEY,JSON.stringify(attempts));return 'local';
  }catch(e){return 'fail'}
}
const pctOf=a=>Math.round(100*a.correct/a.total);
function qStats(){
  const st={};
  mine().forEach(a=>{const r=a.results||{};Object.keys(r).forEach(k=>{const s=st[k]||(st[k]={seen:0,right:0,last:null});s.seen++;s.right+=r[k]?1:0;s.last=r[k]?1:0})});
  return st;
}
function weakIds(){const st=qStats();return Q.filter(q=>st[q.id]&&st[q.id].last===0).map(q=>q.id)}
function pickExam(){
  const st=qStats(),out=[];
  DOMAINS.forEach((_,k)=>{
    const pool=Q.filter(q=>q.d===k+1).map(q=>{const s=st[q.id];let sc=Math.random();if(!s)sc+=2;else if(s.last===0)sc+=1.5;return {q:q,sc:sc}}).sort((a,b)=>b.sc-a.sc);
    pool.slice(0,EXAM_MIX[k]).forEach(x=>out.push(x.q));
  });
  return out;
}

/* ---------- backup and import ---------- */
function exportText(){
  const cards={};
  const labs={};
  Object.keys(EXAMS).forEach(e=>{const c=readCS(e);if(Object.keys(c).length)cards[e]=c;const l=readLS(e);if(Object.keys(l).length)labs[e]=l});
  return JSON.stringify({app:'cert-practice-lab',version:1,attempts:attempts,cards:cards,labs:labs},null,1);
}
function cleanAttempt(a){
  if(!a||typeof a!=='object')return null;
  if(typeof a.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(a.id))return null;
  if(typeof a.when!=='number'||typeof a.total!=='number'||typeof a.correct!=='number')return null;
  if(!Array.isArray(a.byD)||!a.results||typeof a.results!=='object')return null;
  for(const x of a.byD){if(!x||typeof x.c!=='number'||typeof x.t!=='number')return null}
  const results={};Object.keys(a.results).forEach(k=>{results[String(k)]=a.results[k]?1:0});
  return {id:a.id,when:a.when,mode:a.mode==='practice'?'practice':'exam',exam:typeof a.exam==='string'&&EXAMS[a.exam]?a.exam:'gh900',total:a.total,correct:a.correct,ms:typeof a.ms==='number'?a.ms:0,byD:a.byD.map(x=>({c:x.c,t:x.t})),results:results};
}
async function importData(text){
  let obj;
  try{obj=JSON.parse(text)}catch(e){return 'That file is not valid JSON.'}
  const list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.attempts)?obj.attempts:[]);
  let cardsAdded=0;
  if(obj&&!Array.isArray(obj)&&obj.cards&&typeof obj.cards==='object'){
    Object.keys(obj.cards).forEach(e=>{
      if(!EXAMS[e])return;
      const inc=cleanCS(obj.cards[e]),cur=readCS(e);let ch=false;
      Object.keys(inc).forEach(k=>{if(!cur[k]||inc[k].s>cur[k].s){cur[k]=inc[k];ch=true;cardsAdded++}});
      if(ch)writeCS(e,cur);
    });
  }
  let labsAdded=0;
  if(obj&&!Array.isArray(obj)&&obj.labs&&typeof obj.labs==='object'){
    Object.keys(obj.labs).forEach(e=>{
      if(!EXAMS[e])return;
      const inc=cleanLS(obj.labs[e]),cur=readLS(e);let ch=false;
      Object.keys(inc).forEach(k=>{if(!cur[k]){cur[k]=1;ch=true;labsAdded++}});
      if(ch)writeLS(e,cur);
    });
  }
  if(!list.length&&!cardsAdded&&!labsAdded)return 'No attempts, flashcard or lab progress were found in that file.';
  const have=new Set(attempts.map(a=>a.id));let added=0,bad=0;
  for(const raw of list){
    const a=cleanAttempt(raw);
    if(!a){bad++;continue}
    if(have.has(a.id))continue;
    const r=await saveAttempt(a);
    if(r==='fail')return 'Importing stopped after '+added+' attempts because saving failed.';
    have.add(a.id);added++;
  }
  return 'Imported '+added+' new attempt'+(added===1?'':'s')+(cardsAdded?' and progress on '+cardsAdded+' flashcard'+(cardsAdded===1?'':'s'):'')+(labsAdded?(cardsAdded?', plus ':' and ')+labsAdded+' lab task'+(labsAdded===1?'':'s'):'')+(bad?'; skipped '+bad+' that were not valid':'')+'.';
}
function downloadBackup(){
  try{
    const blob=new Blob([exportText()],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='cert-practice-lab-progress.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    S.msg='Backup downloaded.';
  }catch(e){S.msg='Download was blocked. Use Copy as JSON instead.'}
  render();
}
function copyBackup(){
  const text=exportText();
  const fail=()=>{S.msg='Copying was blocked. Select the text below and copy it.';S.showJson=text;render()};
  try{
    navigator.clipboard.writeText(text).then(()=>{S.msg='Copied. Paste it into a file ending in .json to keep it.';S.showJson='';render()},fail);
  }catch(e){fail()}
}
function backupHtml(){
  let h='<section class="block"><h2>Back up or move your progress</h2><p class="hint">'+(storeKind==='cloud'?'Your attempts are saved privately with this page. You can still copy them as JSON or import a backup.':'Your attempts live in this browser only. Download a backup to keep them safe or to move them to another device.')+'</p><div class="row">';
  if(storeKind==='local')h+='<button type="button" class="btn" data-act="exportDl">Download backup</button>';
  h+='<button type="button" class="btn" data-act="exportCopy">Copy as JSON</button><label class="btn" for="imp">Import backup</label><input type="file" id="imp" accept=".json,application/json" hidden></div>';
  if(S.msg)h+='<p class="hint" style="margin-top:8px" role="status">'+esc(S.msg)+'</p>';
  if(S.showJson)h+='<textarea class="jsonbox" readonly aria-label="Progress backup as JSON">'+esc(S.showJson)+'</textarea>';
  return h+'</section>';
}

/* ---------- question engine ---------- */
function prep(q){
  const c=Object.assign({},q);
  if(q.t==='mc'||q.t==='multi'){
    const p=shuffle(q.opts.map((_,i)=>i));
    c.opts=p.map(i=>q.opts[i]);
    c.a=q.t==='mc'?p.indexOf(q.a):q.a.map(x=>p.indexOf(x)).sort((x,y)=>x-y);
  }
  if(q.t==='match'){c.disp=shuffle(q.items.map((_,i)=>i))}
  return c;
}
function initAns(q){
  switch(q.t){
    case 'mc':return -1;
    case 'multi':return [];
    case 'yn':return q.rows.map(()=>null);
    case 'dd':return q.sels.map(()=>-1);
    case 'match':return q.slots.map(()=>-1);
    case 'order':{let p=q.steps.map((_,i)=>i);do{p=shuffle(p)}while(p.every((v,i)=>v===i));return p}
  }
}
function solution(q){
  switch(q.t){
    case 'mc':return q.a;
    case 'multi':return q.a;
    case 'yn':return q.rows.map(r=>r[1]);
    case 'dd':return q.sels.map(s=>s[1]);
    case 'match':return q.slots.map(s=>s[1]);
    case 'order':return q.steps.map((_,i)=>i);
  }
}
function isCorrect(q,a){
  const s=solution(q);
  if(q.t==='mc')return a===s;
  return Array.isArray(a)&&a.length===s.length&&a.every((v,i)=>v===s[i]);
}
function lines(q,a){
  switch(q.t){
    case 'mc':return [a<0?'No answer':q.opts[a]];
    case 'multi':return a.length?a.map(i=>q.opts[i]):['No answer'];
    case 'yn':return q.rows.map((r,i)=>(a[i]===null?'?':a[i]?'Yes':'No')+'  '+r[0]);
    case 'dd':return [(q.codeTpl||q.tpl).replace(/\{(\d)\}/g,(m,k)=>a[k]<0?'[ ? ]':'['+q.sels[k][0][a[k]]+']')];
    case 'match':return q.slots.map((s,i)=>s[0]+'  ->  '+(a[i]<0?'?':q.items[a[i]]));
    case 'order':return a.map((v,i)=>(i+1)+'. '+q.steps[v]);
  }
}
function stemOf(q){return (q.t==='dd'&&!q.codeTpl)?q.tpl.replace(/\{\d\}/g,'____'):q.q}
function qBlock(q){return '<p class="stem">'+esc(stemOf(q))+'</p>'+(q.code?'<pre class="code">'+esc(q.code)+'</pre>':'')}
function linksHtml(key){
  const t=TOPICS[key];if(!t)return '';
  return '<span class="links">'+t.l.map(x=>'<span><a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer">'+esc(x[0])+'</a><span class="k">'+x[2]+'</span></span>').join('')+'</span>';
}
function reviseLine(q){const t=TOPICS[q.topic];return t?'<p class="rev">Revise: '+esc(t.n)+'<br>'+linksHtml(q.topic)+'</p>':''}
function feedback(q,a){
  const ok=isCorrect(q,a);
  let h='<div class="fb '+(ok?'ok':'no')+'"><div class="fb-h">'+(ok?'Correct':'Incorrect')+'</div>';
  if(!ok)h+=lines(q,a).map(l=>'<div class="diff del">'+esc(l)+'</div>').join('');
  h+=lines(q,solution(q)).map(l=>'<div class="diff add">'+esc(l)+'</div>').join('');
  return h+'<p class="why">'+esc(q.why)+'</p>'+(ok?'':reviseLine(q))+'</div>';
}
function answerOnly(q){
  const sol=Q.find(x=>x.id===q.id)||q;
  let h='<div class="fb ok"><div class="fb-h">Correct answer</div>';
  h+=lines(sol,solution(sol)).map(l=>'<div class="diff add">'+esc(l)+'</div>').join('');
  return h+'<p class="why">'+esc(sol.why)+'</p>'+reviseLine(sol)+'</div>';
}
const isLocked=()=>S.screen==='quiz'&&S.mode==='practice'&&!!S.checked[S.i];
const fmtT=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+pad(m):m)+':'+pad(r)};
const fmtD=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function tick(){const el=document.getElementById('timer');if(el)el.textContent=fmtT(Date.now()-S.t0)}

function startQuiz(mode,list){
  S.mode=mode;S.qs=shuffle(list.map(prep));S.i=0;S.ans=S.qs.map(initAns);
  S.touched={};S.flags={};S.checked={};S.sel=null;S.confirm=false;S.t0=Date.now();S.screen='quiz';
  clearInterval(S.timer);S.timer=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}
